<div class="telecom-services-section">
  <h2 class="section-title">Our offer</h2>
  <div class="cards-wrapper">
    <div *ngFor="let service of telecomServices" class="service-card">
      <div class="card-icon">
        <i class="fa fa-signal" aria-hidden="true"></i>
      </div>
      <div class="card-header">
        <h3>{{ service.name }}</h3>
      </div>
      <p class="description">{{ service.description }}</p>
      <div class="card-prices">
        <span class="price">{{ service.price | currency }}</span>
        <span class="monthly-price">{{ service.monthlyPrice | currency }}/month</span>
      </div>
      <div class="card-buttons">
        <button (click)="onBuyService(service)">Buy</button>
        <button (click)="monthlySubscription(service)">Subscribe 1 month</button>
      </div>
    </div>
  </div>
</div>

<app-payment-method-modal
  *ngIf="showPaymentModal || showQRCode"
  [paymentMethods]="paymentMethods"
  [qrCodeData]="qrCodeData"
  [showQRCode]="showQRCode"
  (selectedPaymentMethod)="onPaymentMethodSelected($event)">
</app-payment-method-modal>
